# Default Real IP configuration for Docker environments (loopback and Docker bridge networks)
# This file is dynamically re-generated at container startup by entrypoint.py from TRUSTED_PROXIES.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
